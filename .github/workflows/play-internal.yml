# Signed release AAB → Google Play Internal testing track.

# Requires repository secrets (Settings → Secrets and variables → Actions):

#   ANDROID_KEYSTORE_BASE64  — base64-encoded upload keystore (.jks), no PEM headers

#   KEYSTORE_PASSWORD        — keystore store password (STORE_PASSWORD in keystore.properties)

#   KEY_ALIAS                — key alias (e.g. upload)

#   KEY_PASSWORD             — key password (KEY_PASSWORD in keystore.properties)

#   PLAY_SERVICE_ACCOUNT_JSON — Play Console service account JSON (plain text)

#

# Trigger: version tag (v*) or manual dispatch.

# Troubleshooting: README → "GitHub Actions" → "Signing secrets troubleshooting"



name: Play Internal Release



on:

  push:

    tags:

      - "v*"

  workflow_dispatch:



concurrency:

  group: play-internal-${{ github.ref }}

  cancel-in-progress: false



env:

  CI_GRADLE_JVMARGS: "-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"



jobs:

  release:

    name: Build signed AAB and upload

    runs-on: ubuntu-latest

    timeout-minutes: 45

    env:

      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

      ORG_GRADLE_PROJECT_org_gradle_jvmargs: "-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"



    steps:

      - name: Checkout

        uses: actions/checkout@v4



      - name: Prepare Gradle for CI

        run: |

          chmod +x gradlew

          sed -i '/^org.gradle.java.home=/d' gradle.properties

          sed -i '/^java.home=/d' gradle/gradle-jvm.properties 2>/dev/null || true

          if grep -q '^org.gradle.jvmargs=' gradle.properties; then

            sed -i "s|^org.gradle.jvmargs=.*|org.gradle.jvmargs=${CI_GRADLE_JVMARGS}|" gradle.properties

          else

            echo "org.gradle.jvmargs=${CI_GRADLE_JVMARGS}" >> gradle.properties

          fi

          echo "Effective gradle.properties JVM settings:"

          grep org.gradle.jvmargs gradle.properties



      - name: Set up JDK 17

        uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: "17"

          cache: gradle



      - name: Decode upload keystore

        env:

          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

        run: |

          set -euo pipefail

          mkdir -p release

          # Strip whitespace/newlines (common when pasting base64 into GitHub Secrets)

          B64="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')"

          if [ -z "$B64" ]; then

            echo "::error::ANDROID_KEYSTORE_BASE64 is empty. Encode release/upload-keystore.jks (see README)."

            exit 1

          fi

          if printf '%s' "$B64" | grep -qE '^-----BEGIN'; then

            echo "::error::ANDROID_KEYSTORE_BASE64 looks like PEM (certutil -encode). Use raw file base64 only."

            exit 1

          fi

          printf '%s' "$B64" | base64 -d > release/upload-keystore.jks

          SIZE="$(wc -c < release/upload-keystore.jks | tr -d ' ')"

          if [ "$SIZE" -lt 100 ]; then

            echo "::error::Decoded keystore is too small (${SIZE} bytes). Re-encode the full .jks file."

            exit 1

          fi

          echo "Decoded upload keystore: ${SIZE} bytes"



      - name: Create keystore.properties

        env:

          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |

          set -euo pipefail

          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }

          STORE_PASSWORD="$(trim "$KEYSTORE_PASSWORD")"

          KEY_ALIAS_TRIM="$(trim "$KEY_ALIAS")"

          KEY_PASSWORD_TRIM="$(trim "$KEY_PASSWORD")"

          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS_TRIM" ] || [ -z "$KEY_PASSWORD_TRIM" ]; then

            echo "::error::KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD must all be set (non-empty after trim)."

            exit 1

          fi

          {

            echo 'STORE_FILE=release/upload-keystore.jks'

            printf 'STORE_PASSWORD=%s\n' "$STORE_PASSWORD"

            printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS_TRIM"

            printf 'KEY_PASSWORD=%s\n' "$KEY_PASSWORD_TRIM"

          } > keystore.properties

          echo "Wrote keystore.properties (passwords not logged)."



      - name: Validate upload keystore

        env:

          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

        run: |

          set -euo pipefail

          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }

          STORE_PASSWORD="$(trim "$KEYSTORE_PASSWORD")"

          KEY_ALIAS_TRIM="$(trim "$KEY_ALIAS")"

          KS="release/upload-keystore.jks"



          if keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS_TRIM" >/dev/null 2>&1; then

            echo "Keystore store password and alias validated."

            exit 0

          fi



          echo "::error::Keystore validation failed before Gradle build."

          echo "Map local keystore.properties → GitHub secrets:"

          echo "  STORE_PASSWORD  → KEYSTORE_PASSWORD"

          echo "  KEY_ALIAS       → KEY_ALIAS"

          echo "  KEY_PASSWORD    → KEY_PASSWORD (checked at signReleaseBundle; fix if alias step passes but Gradle fails)"

          echo "  (upload .jks)   → ANDROID_KEYSTORE_BASE64"

          echo ""

          echo "Common mistakes: KEYSTORE_PASSWORD vs KEY_PASSWORD swapped; wrong KEY_ALIAS; certutil PEM instead of raw base64; trailing newline in a secret."



          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then

            echo "Diagnosis: store password rejected or keystore file corrupted/truncated."

            echo "Re-encode the same release/upload-keystore.jks used locally (README PowerShell snippet)."

          else

            echo "Diagnosis: store password OK; KEY_ALIAS does not match. Aliases in this keystore:"

            keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' || true

          fi

          exit 1



      - name: Build signed release AAB

        run: ./gradlew bundleRelease --no-daemon -Dorg.gradle.jvmargs="${{ env.CI_GRADLE_JVMARGS }}"



      - name: Upload AAB artifact

        uses: actions/upload-artifact@v4

        with:

          name: app-release-signed

          path: app/build/outputs/bundle/release/app-release.aab

          if-no-files-found: error



      - name: Upload to Play Internal testing

        uses: r0adkll/upload-google-play@v1.1.3

        with:

          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

          packageName: com.eslamielectric.android

          releaseFiles: app/build/outputs/bundle/release/app-release.aab

          track: internal

          status: completed


