# Signed release AAB → Google Play Internal testing track (fully automated on internal).
# Requires repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  — base64-encoded upload keystore (.jks), no PEM headers
#   KEYSTORE_PASSWORD        — keystore store password (STORE_PASSWORD in keystore.properties)
#   KEY_ALIAS                — key alias (e.g. upload)
#   KEY_PASSWORD             — key password (KEY_PASSWORD in keystore.properties)
#   PLAY_SERVICE_ACCOUNT_JSON — Play Console service account JSON (plain text)
#
# Triggers: every push to main (primary), optional v* tag, or manual dispatch.
# versionCode: passed as -PversionCode (run_number + offset); not committed per push.
# One-time Play Console setup still required (store listing, content rating, etc.) — see README.

name: Play Internal Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: play-internal-${{ github.ref }}
  cancel-in-progress: false

env:
  CI_GRADLE_JVMARGS: "-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
  # Must stay above the highest versionCode already on Play (local default is 11).
  VERSION_CODE_OFFSET: 100

jobs:
  release:
    name: Build signed AAB and upload
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
      ORG_GRADLE_PROJECT_org_gradle_jvmargs: "-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Gradle for CI
        run: |
          chmod +x gradlew
          sed -i '/^org.gradle.java.home=/d' gradle.properties
          sed -i '/^java.home=/d' gradle/gradle-jvm.properties 2>/dev/null || true
          if grep -q '^org.gradle.jvmargs=' gradle.properties; then
            sed -i "s|^org.gradle.jvmargs=.*|org.gradle.jvmargs=${CI_GRADLE_JVMARGS}|" gradle.properties
          else
            echo "org.gradle.jvmargs=${CI_GRADLE_JVMARGS}" >> gradle.properties
          fi
          echo "Effective gradle.properties JVM settings:"
          grep org.gradle.jvmargs gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Resolve versionCode for this run
        id: version
        run: |
          CODE=$(( ${{ github.run_number }} + ${{ env.VERSION_CODE_OFFSET }} ))
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building with versionCode=$CODE (run_number=${{ github.run_number }} + offset=${{ env.VERSION_CODE_OFFSET }})"

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p release
          B64="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')"
          if [ -z "$B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty. Encode release/upload-keystore.jks (see README)."
            exit 1
          fi
          if printf '%s' "$B64" | grep -qE '^-----BEGIN'; then
            echo "::error::ANDROID_KEYSTORE_BASE64 looks like PEM (certutil -encode). Use raw file base64 only."
            exit 1
          fi
          printf '%s' "$B64" | base64 -d > release/upload-keystore.jks
          SIZE="$(wc -c < release/upload-keystore.jks | tr -d ' ')"
          if [ "$SIZE" -lt 100 ]; then
            echo "::error::Decoded keystore is too small (${SIZE} bytes). Re-encode the full .jks file."
            exit 1
          fi
          echo "Decoded upload keystore: ${SIZE} bytes"

      - name: Create keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          STORE_PASSWORD="$(trim "$KEYSTORE_PASSWORD")"
          KEY_ALIAS_TRIM="$(trim "$KEY_ALIAS")"
          KEY_PASSWORD_TRIM="$(trim "$KEY_PASSWORD")"
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS_TRIM" ] || [ -z "$KEY_PASSWORD_TRIM" ]; then
            echo "::error::KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD must all be set (non-empty after trim)."
            exit 1
          fi
          {
            echo 'STORE_FILE=release/upload-keystore.jks'
            printf 'STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS_TRIM"
            printf 'KEY_PASSWORD=%s\n' "$KEY_PASSWORD_TRIM"
          } > keystore.properties
          echo "Wrote keystore.properties (passwords not logged)."

      - name: Validate upload keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          STORE_PASSWORD="$(trim "$KEYSTORE_PASSWORD")"
          KEY_ALIAS_TRIM="$(trim "$KEY_ALIAS")"
          KS="release/upload-keystore.jks"

          if keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS_TRIM" >/dev/null 2>&1; then
            echo "Keystore store password and alias validated."
            exit 0
          fi

          echo "::error::Keystore validation failed before Gradle build."
          echo "Map local keystore.properties → GitHub secrets:"
          echo "  STORE_PASSWORD  → KEYSTORE_PASSWORD"
          echo "  KEY_ALIAS       → KEY_ALIAS"
          echo "  KEY_PASSWORD    → KEY_PASSWORD"
          echo "  (upload .jks)   → ANDROID_KEYSTORE_BASE64"
          exit 1

      - name: Build signed release AAB
        run: ./gradlew bundleRelease --no-daemon -PversionCode=${{ steps.version.outputs.code }} -Dorg.gradle.jvmargs="${{ env.CI_GRADLE_JVMARGS }}"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Validate Play service account JSON
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON}" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is empty. Paste the full service account JSON from GCP (see README)."
            exit 1
          fi
          TRIM="$(printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          FIRST="$(printf '%s' "$TRIM" | head -c 1)"
          if [ "$FIRST" != "{" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON must start with '{' (full JSON file, not base64 or a PEM/private key)."
            exit 1
          fi
          if printf '%s' "$TRIM" | grep -qE '^-----BEGIN'; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON looks like PEM, not JSON."
            exit 1
          fi
          if ! printf '%s' "$TRIM" | python3 -m json.tool > /dev/null; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not valid JSON. Re-download from GCP and paste the entire file into the GitHub secret."
            exit 1
          fi
          TYPE="$(printf '%s' "$TRIM" | python3 -c "import json,sys; print(json.load(sys.stdin).get('type',''))")"
          if [ "$TYPE" != "service_account" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON must contain \"type\": \"service_account\"."
            exit 1
          fi
          echo "Play service account JSON validated."

      - name: Write Play service account credentials
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          mkdir -p .play-credentials
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > .play-credentials/service-account.json
          chmod 600 .play-credentials/service-account.json

      - name: Upload to Play Internal testing
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJson: .play-credentials/service-account.json
          packageName: com.eslamielectric.android
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          # Avoids manual "Send for review" on internal when Play has pending/rejected edits.
          changesNotSentForReview: true
