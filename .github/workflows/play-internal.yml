# Signed release AAB → Google Play Internal testing track.
# Requires repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  — base64-encoded upload keystore (.jks)
#   KEYSTORE_PASSWORD        — keystore store password
#   KEY_ALIAS                — key alias (e.g. upload)
#   KEY_PASSWORD             — key password
#   PLAY_SERVICE_ACCOUNT_JSON — Play Console service account JSON (plain text)
#
# Trigger: version tag (v*) or manual dispatch.

name: Play Internal Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: play-internal-${{ github.ref }}
  cancel-in-progress: false

env:
  CI_GRADLE_JVMARGS: "-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

jobs:
  release:
    name: Build signed AAB and upload
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
      ORG_GRADLE_PROJECT_org_gradle_jvmargs: "-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Gradle for CI
        run: |
          chmod +x gradlew
          sed -i '/^org.gradle.java.home=/d' gradle.properties
          sed -i '/^java.home=/d' gradle/gradle-jvm.properties 2>/dev/null || true
          if grep -q '^org.gradle.jvmargs=' gradle.properties; then
            sed -i "s|^org.gradle.jvmargs=.*|org.gradle.jvmargs=${CI_GRADLE_JVMARGS}|" gradle.properties
          else
            echo "org.gradle.jvmargs=${CI_GRADLE_JVMARGS}" >> gradle.properties
          fi
          echo "Effective gradle.properties JVM settings:"
          grep org.gradle.jvmargs gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode upload keystore
        run: |
          mkdir -p release
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release/upload-keystore.jks

      - name: Create keystore.properties
        run: |
          cat > keystore.properties <<EOF
          STORE_FILE=release/upload-keystore.jks
          STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build signed release AAB
        run: ./gradlew bundleRelease --no-daemon -Dorg.gradle.jvmargs="${{ env.CI_GRADLE_JVMARGS }}"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload to Play Internal testing
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.eslamielectric.android
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
