# Compile and assemble on every push to main (no signing secrets required).
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_GRADLE_JVMARGS: "-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

jobs:
  compile:
    name: Compile release Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=${{ env.CI_GRADLE_JVMARGS }}"
      ORG_GRADLE_PROJECT_org_gradle_jvmargs: ${{ env.CI_GRADLE_JVMARGS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Gradle for CI
        run: |
          chmod +x gradlew
          sed -i '/^org.gradle.java.home=/d' gradle.properties
          sed -i '/^java.home=/d' gradle/gradle-jvm.properties 2>/dev/null || true
          if grep -q '^org.gradle.jvmargs=' gradle.properties; then
            sed -i "s|^org.gradle.jvmargs=.*|org.gradle.jvmargs=${CI_GRADLE_JVMARGS}|" gradle.properties
          else
            echo "org.gradle.jvmargs=${CI_GRADLE_JVMARGS}" >> gradle.properties
          fi
          echo "Effective gradle.properties JVM settings:"
          grep org.gradle.jvmargs gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Compile release Kotlin
        run: ./gradlew compileReleaseKotlin --no-daemon -Dorg.gradle.jvmargs="${{ env.CI_GRADLE_JVMARGS }}"

      - name: Compile debug Kotlin
        run: ./gradlew compileDebugKotlin --no-daemon -Dorg.gradle.jvmargs="${{ env.CI_GRADLE_JVMARGS }}"

      - name: Build unsigned release AAB
        run: ./gradlew bundleRelease --no-daemon -Dorg.gradle.jvmargs="${{ env.CI_GRADLE_JVMARGS }}"

      - name: Upload unsigned AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
