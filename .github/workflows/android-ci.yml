# Compile and assemble on every push to main (no signing secrets required).
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile release Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Gradle for CI
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: Compile release Kotlin
        run: ./gradlew compileReleaseKotlin --no-daemon

      - name: Compile debug Kotlin
        run: ./gradlew compileDebugKotlin --no-daemon

      - name: Build unsigned release AAB
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload unsigned AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
